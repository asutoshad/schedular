<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 350px;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        input:focus {
            border-color: #4A90E2;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4A90E2;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #357ABD;
        }

        .login-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .login-link a {
            text-decoration: none;
            color: #4A90E2;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Create Account</h2>

		<form th:action="@{/save}" method="post">
		    <input type="text" name="username" placeholder="Username" required>
		    <input type="email" name="email" placeholder="Email Address" required>
		    <input type="password" name="password" placeholder="Password" required>

		    <button type="submit">Sign Up</button>
		</form>
		
		<a href="/oauth2/authorization/google">
		    <button>Login with Google</button>
		</a>



        <div class="login-link">
            Already have an account? <a href="/login">Login</a>
        </div>
    </div>

</body>
</html>
